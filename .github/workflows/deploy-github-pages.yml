name: Customer website (GitHub Pages)

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/**"
      - "scraper/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "bachathub-github-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build website (static GitHub data mode)
        env:
          VITE_STATIC_MODE: "true"
          VITE_BASE: "/bachathub-pakistan/"
        run: npm run build
      - name: Add data snapshot as offline fallback
        run: |
          mkdir -p dist/data/public
          cp data/public/bootstrap.json dist/data/public/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
