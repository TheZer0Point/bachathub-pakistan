name: BachatHub 100% Pure GitHub Pages Deploy

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "bachathub-github-pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build BachatHub Pakistan (Static GitHub Pages Mode)
        env:
          VITE_STATIC_MODE: "true"
          VITE_BASE: "/bachathub-pakistan/"
        run: npm run build

      - name: Bundle public JSON snapshots for fallback distribution
        run: |
          mkdir -p dist/data/public
          cp -r data/public/*.json dist/data/public/ 2>/dev/null || true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./dist"

      - name: Deploy directly to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
