name: BachatHub Scraper (every 30 min)

on:
  schedule:
    - cron: "11,41 * * * *"   # off the busy :00/:30 marks (GitHub delays/drops runs at those times)
  workflow_dispatch:
    inputs:
      cycle:
        description: "Admin 'Run cycle' button. 4 or 'all' = heavy run (Meta Ad Library, OpenStreetMap, JS sites)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: bachathub-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Decide light or heavy run
        id: mode
        run: |
          HOUR=$(date -u +%H); MIN=$(date -u +%M)
          HEAVY=false
          if [ "${{ github.event.inputs.cycle }}" = "4" ] || [ "${{ github.event.inputs.cycle }}" = "all" ]; then HEAVY=true; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ $((10#$HOUR % 6)) -eq 0 ] && [ $((10#$MIN)) -lt 30 ]; then HEAVY=true; fi
          if [ ! -f data/public/scraped.json ]; then HEAVY=true; fi
          # chained/admin runs: heavy again when the last heavy run is 6h+ old
          LAST=$(python3 -c "import json,datetime as d;s=json.load(open('data/public/status.json'));t=s.get('lastHeavyRunAt') or '2000-01-01T00:00:00Z';print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(t.replace('Z','+00:00'))).total_seconds()//3600))" 2>/dev/null || echo 99)
          if [ "${LAST:-99}" -ge 6 ]; then HEAVY=true; fi
          echo "heavy=$HEAVY" >> "$GITHUB_OUTPUT"
          echo "Heavy run: $HEAVY"

      - name: Install headless browser (heavy runs only)
        if: steps.mode.outputs.heavy == 'true'
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.mode.outputs.heavy }}" = "true" ]; then
            python scraper/bachathub_scraper.py --heavy
          else
            python scraper/bachathub_scraper.py
          fi

      - name: Save new data to the repo
        run: |
          git config user.name "BachatHub Scraper Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "data: scraper update $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin main; then
              # admin may have changed data/config/curated.json meanwhile -> rebuild bootstrap with latest admin edits
              python scraper/bachathub_scraper.py --merge-only
              git add data/public && git commit --amend --no-edit -q || true
              git push && exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "Could not push after 4 tries" && exit 1

  # Backup clock: GitHub's own schedule can stay silent for hours on a new repo.
  # After each run, wait ~25 min and start the next one, unless another run is already queued/running.
  next-run:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Wait, then start the next scraper run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sleep 1500
          others=$(gh run list -R "$REPO" -w staggered_sync.yml -L 20 --json databaseId,status \
            -q "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status==\"queued\" or .status==\"in_progress\" or .status==\"waiting\" or .status==\"pending\")] | length")
          if [ "${others:-0}" -gt 0 ]; then echo "Another run is already active - not starting a new one."; exit 0; fi
          gh workflow run staggered_sync.yml -R "$REPO" --ref main
          echo "Next run started."
